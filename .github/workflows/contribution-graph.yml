name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: amit0236
          outputs: |
            dist/contribution-graph.svg?palette=github-dark
            dist/contribution-graph-dark.svg?palette=github-dark&color_snake=%2300FF9C

      - name: Commit generated graph
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution graph"
          add: "dist/"
